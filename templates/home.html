{% extends "base.html" %}

{% block content %}
<h1>FairShare Chores</h1>

<section>
    <h2>Create a household</h2>
    <form method="post" action="{% url 'create_household' %}">
        {% csrf_token %}
        {{ create_form.non_field_errors }}
        {{ create_form.as_p }}
        <button type="submit">Create</button>
    </form>
</section>

<section>
    <h2>Join with a code</h2>
    <form method="post" action="{% url 'join_household' %}">
        {% csrf_token %}
        {{ join_form.non_field_errors }}
        {{ join_form.as_p }}
        <button type="submit">Join</button>
    </form>
</section>
{% endblock %}
