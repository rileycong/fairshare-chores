{% extends "base.html" %}

{% block content %}
<h1>{% if chore %}Edit chore{% else %}New chore{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<p><a href="{% url 'chore_list' %}">Back to chores</a></p>
{% endblock %}
